apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-public
  labels:
    app: traefik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-account
      containers:
        - name: traefik
          image: traefik:2.7
          args:
            - --api.insecure=true
            - --providers.kubernetesingress
          ports:
            - containerPort: 80
            - containerPort: 8080
          restartPolicy: Always